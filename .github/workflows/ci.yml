name: Backend CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sigesu_test
          POSTGRES_USER: sigesu
          POSTGRES_PASSWORD: integration-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sigesu -d sigesu_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify unit and PostgreSQL integration tests
        run: bash mvnw -B verify
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/sigesu_test
          TEST_DATABASE_USERNAME: sigesu
          TEST_DATABASE_PASSWORD: integration-only
