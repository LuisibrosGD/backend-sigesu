services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: sigesu_test
      POSTGRES_USER: sigesu
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigesu -d sigesu_test"]
      interval: 5s
      retries: 10
    volumes:
      - test-db:/var/lib/postgresql/data
volumes:
  test-db:
